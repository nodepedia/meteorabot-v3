# =========================================================
#  METEORA BOT — default strategi (DI-COMMIT ke git)
#  Ubah nilai tuning DI SINI lalu `git commit`, bukan di .env.
#  Rahasia & setelan instance (wallet, RPC, API key, telegram,
#  DRY_RUN) ada di .env — file itu tidak di-commit.
#  Nilai di file ini MENANG atas .env bila key-nya sama.
# =========================================================

# true = PnL ditampilkan/dihitung dalam basis SOL
SOL_MODE=true

# ===== Entry =====
# Aktifkan/nonaktifkan modul entry
ENTRY_ENABLED=true
# File daftar pool. Isi cukup alamat pool per baris (pakai default di bawah),
# atau `alamat,entry_size` / `alamat,entry_size,,mode`.
# Kolom ke-3 (max posisi lama) kalau masih tertulis diabaikan: tidak ada batas
# jumlah entry seumur hidup. Yang membatasi: baris tidak diawali `#`, dan
# paling banyak 1 posisi non-DCA per strategi (spot atau bidask) per pool.
# Varian bidask:double / token / sol berbagi slot bidask. DCA tidak memakai slot itu.
POOL_LIST_FILE=pool.txt
# Default entry_size (SOL) untuk baris yang hanya berisi alamat. entry_size harus > 0.
ENTRY_DEFAULT_SIZE_SOL=0.1
# Refresh kandidat pool + posisi terbuka (detik), bukan cadence sinyal.
# Sensitivitas sinyal diatur oleh JUPITER_POLL_INTERVAL_SEC.
ENTRY_SCAN_INTERVAL_SEC=15
# Timeframe candle untuk Supertrend (gmgn resolution): 1m/5m/15m/1h/4h/1d
ENTRY_TIMEFRAME=15m
# Parameter Supertrend
ST_ATR_PERIOD=10
ST_MULTIPLIER=3
# Sinyal entry selalu bullish: held_pullback (default; close harus tetap di atas garis)
# | first_touch (entry begitu candle menyentuh garis bullish, abaikan close)
ENTRY_TOUCH_MODE=held_pullback
# Jika dalam X jam tidak entry, pool dinonaktifkan (baris diberi '#' otomatis)
ENTRY_EXPIRY_HOURS=24
# Ukuran entry (SOL) default lewat ENTRY_DEFAULT_SIZE_SOL; bisa di-override per
# pool dengan menulis `alamat,size` di pool.txt. Porsi sisi SOL (0.5 = rata:
# 1 SOL + 1 SOL setara token) — berlaku untuk semua pool
ENTRY_SIZE_SPLIT=0.5
# Entry bidask:double hanya ke pool dengan bin step >= angka ini (100 = 1% per bin).
# Di antara pool X/SOL token itu yang lolos, yang dipakai = fee/active TVL 30m tertinggi.
# Baris CA: saring kandidat. Baris alamat pool: kalau pool itu di bawah ambang, cari
# pool X/SOL lain yang lolos; kalau tidak ada, lewati siklus ini TANPA memberi '#'.
# Spot tidak kena aturan ini. DCA posisi yang sudah terbuka tetap di pool itu.
# 0 = aturan mati (masuk ke pool apa pun).
BIDASK_DOUBLE_MIN_BIN_STEP=100
# Rentang bin & strategi entry selalu fixed: BidAsk dua sisi, bin -34/+34.
# Slippage untuk initialize position (basis poin)
ENTRY_SLIPPAGE_BPS=1000
# Toleransi pergeseran bin aktif saat add-liquidity, dalam PERSEN (SDK memakai
# persen, bukan basis poin). 10 = ~5 bin pada pool binStep 2%.
ENTRY_ACTIVE_BIN_SLIPPAGE_PCT=10
# Rem harga: batalkan entry/DCA bila harga aktif pool menyimpang dari harga
# pasar (Jupiter) melebihi ambang ini (persen). Contoh: pool tipis yang salah
# harga. Gagal ambil harga pasar = tetap lanjut (fail-open).
ENTRY_POOL_PRICE_CHECK=true
ENTRY_MAX_POOL_PRICE_DEVIATION_PCT=15
# Saat deviasi di atas ambang, coba ulang beberapa kali (baca ulang harga tiap
# percobaan). Entry: kalau tetap meleset -> pool dinonaktifkan ('#' di pool.txt).
# DCA: kalau tetap meleset -> DCA posisi itu dihentikan (pool tetap aktif).
ENTRY_POOL_PRICE_MAX_ATTEMPTS=3
ENTRY_POOL_PRICE_RETRY_DELAY_SEC=10
# Sisakan SOL untuk gas
GAS_RESERVE=0.05
# Pool dengan pair selain SOL (mis. -USDC) otomatis DITOLAK & dilewati + alert Telegram.
# Jeda (detik) sebelum pool dicoba lagi setelah entry gagal
ENTRY_FAILURE_COOLDOWN_SEC=300
# true = satu sinyal touch hanya diproses sekali (tidak retry di candle yang sama)
ENTRY_ONE_SHOT_PER_SIGNAL=true
# Nonaktifkan pool (beri '#' di pool.txt) + alert Telegram setelah entry gagal sebanyak ini berturut-turut
ENTRY_MAX_FAILURES=3

# ===== Fee entry (priority fee / Jito tip) =====
# none     = perilaku lama + kirim ulang otomatis (tanpa biaya tambahan)
# priority = sisipkan priority fee (ComputeBudget)
# jito     = bayar tip Jito (dikirim via Jito block engine)
# both     = priority fee + tip Jito
ENTRY_FEE_MODE=none
# Priority fee fixed (micro-lamports per compute unit). Hanya untuk mode priority/both.
ENTRY_PRIORITY_FEE_MICRO_LAMPORTS=50000
# Batas compute unit yang diminta (0 = biarkan SDK Meteora menentukan).
ENTRY_COMPUTE_UNIT_LIMIT=0
# Besar tip Jito (SOL). Hanya untuk mode jito/both.
ENTRY_JITO_TIP_SOL=0.001
# Hard cap estimasi biaya per entry (SOL). Fee melebihi ini -> entry dibatalkan + alert.
ENTRY_FEE_MAX_SOL=0.002
# Jumlah percobaan kirim ulang transaksi entry (blockhash baru tiap percobaan).
ENTRY_TX_RETRY_ATTEMPTS=5
# Batas tunggu konfirmasi tiap transaksi (detik).
ENTRY_TX_CONFIRM_TIMEOUT_SEC=30
# Interval kirim ulang (ms).
ENTRY_TX_RESEND_INTERVAL_MS=2000
# Mode jito/both: kirim juga ke RPC biasa (bukan hanya Jito) untuk peluang lebih tinggi.
ENTRY_DUAL_SEND=true
# Endpoint Jito block engine.
JITO_BLOCK_ENGINE_URL=https://mainnet.block-engine.jito.wtf
# Opsional: override daftar akun tip Jito (dipisah koma). Kosong = pakai bawaan.
JITO_TIP_ACCOUNTS=

# ===== DCA (averaging-down) =====
# Aktifkan DCA: entry baru di pool yang sama saat harga (atau PnL) menyentuh
# ambang arm lalu memantul dari titik terendah (kebalikan trailing TP).
# Perubahan di bagian ini dipakai setelah restart meteorabot-entry.
DCA_ENABLED=true
# price = pemicu dari turunnya harga pool vs entryPoolPrice posisi UTAMA
# (bukan PnL, supaya rebalance tidak menggeser kapan DCA jalan).
# pnl = perilaku lama (PnL posisi). Matikan mode harga dengan: DCA_TRIGGER_MODE=pnl
DCA_TRIGGER_MODE=price
# Mode posisi yang boleh di-DCA (dipisah koma). Default hanya bidask:double;
# spot & bidask:token tidak di-DCA.
DCA_ELIGIBLE_MODES=bidask:double
# --- Ambang mode pnl (hanya dipakai bila DCA_TRIGGER_MODE=pnl, atau posisi
# utama belum punya entryPoolPrice — posisi lama — maka pool itu jatuh ke pnl) ---
# Ambang arm (poin PnL absolut). Contoh -10 = mulai memantau saat PnL <= -10%.
DCA_ARM_PCT=-10
# Ambang arm DCA#2 mode pnl. Dipakai HANYA saat DCA#1 sudah close (acuan posisi utama).
# Kalau DCA#1 masih open, DCA#2 memakai DCA_ARM_PCT dari posisi DCA#1.
DCA_ARM_PCT_2=-30
# --- Ambang mode price (DCA_TRIGGER_MODE=price) ---
# Satu acuan: entryPoolPrice posisi utama. Dua ambang, tidak peduli DCA#1
# masih terbuka atau sudah close.
# DCA#1 saat harga pool turun sampai nilai ini (contoh -20 = turun 20%).
DCA_ARM_PRICE_PCT=-20
# DCA#2 dari acuan yang sama (contoh -35 = turun 35% dari entry posisi utama).
DCA_ARM_PRICE_PCT_2=-35
# Safeguard: saat DCA terakhir (kuota sesi habis) exit karena trailing TP,
# posisi asli (non-DCA) di pool yang sama ikut ditutup. false = nonaktif.
DCA_CLOSE_SAFEGUARD=true
# Besar pantulan dari trough untuk memicu DCA (poin absolut, mis. 1 = +1 poin).
DCA_REBOUND_PCT=1
# Maksimal total DCA per SESI (sejak posisi pertama dibuka sampai semua posisi
# di pool close). Persisten di state.dcaUsage; 1 = sekali, 2 = dua kali.
DCA_MAX_ADDS=2
# Cadence watcher DCA (detik): scan arm/trail + konfirmasi rebound memakai satu
# request PnL yang sama, terpisah dari loop exit. 5 = cek tiap 5 detik.
DCA_POLL_INTERVAL_SEC=5
# Ambang minimum (detik) sebelum rebound dikonfirmasi. Efektifnya = tick watcher.
DCA_CONFIRM_DELAY_SEC=5
# Backoff per-pool (detik) setelah eksekusi DCA gagal.
DCA_COOLDOWN_SEC=300
# Cross-check harga pool saat arm MODE PNL: tahan arm bila PnL sudah <= ambang
# tapi harga pool tidak turun sepadan. Mencegah spike PnL palsu dari datapi.
# Di mode price pemicu sudah harga pool, jadi cek ini tidak dipakai.
# false = nonaktif (perilaku lama mode pnl).
DCA_PRICE_CONFIRM=true
# Ambang "harga nyaris flat" (poin persen, negatif). Arm ditahan bila harga
# pool turun KURANG dari nilai ini dari harga saat posisi dibuka.
# Contoh -1 = butuh harga turun minimal 1%.
DCA_PRICE_FLAT_PCT=-1

# ===== Telegram =====
# Interval status Telegram (menit)
TG_STATUS_INTERVAL=5

# ===== Swap / Sweep =====
# Swap otomatis token base → SOL setelah posisi ditutup
AUTO_SWAP_AFTER_CLOSE=true
# Slippage Jupiter (basis poin) — dipakai bila SWAP_USE_RTSE=false
SWAP_SLIPPAGE_BPS=100
# true = pakai RTSE Jupiter (estimasi slippage otomatis, mode ultra) untuk
# mengurangi gagal swap saat harga bergerak cepat; false = slippage tetap.
SWAP_USE_RTSE=false
# Jumlah percobaan swap (termasuk token-side saat entry)
SWAP_RETRY_ATTEMPTS=3
# Sisa token dengan nilai <= threshold (USD) dianggap dust dan dilewati
DUST_USD_THRESHOLD=0.5
# Mint yang TIDAK ikut di-sweep ke SOL (dipisah koma). Default: USDC.
SWEEP_EXCLUDE_MINTS=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
# Jeda (detik) sebelum mint yang gagal di-swap dicoba lagi (backoff per-mint)
SWEEP_FAILURE_COOLDOWN_SEC=1800
# Swap pasca-close gagal → "swap tertunda": dicoba ulang tiap N detik; pool baru
# ditandai '#' setelah swap tuntas atau dihentikan (give-up + alert Telegram).
SWAP_PENDING_RETRY_SEC=90
SWAP_PENDING_MAX_ATTEMPTS=10
# Token tanpa harga (Jupiter price kosong): berhenti setelah N gagal + alert.
SWAP_UNPRICED_MAX_ATTEMPTS=3

# ===== Logs =====
# Level log PM2. info = naratif (ringkasan 5 menit + event penting + warning/error).
# debug = ikut menampilkan baris [detail] teknis (GMGN/Meteora/siklus, dll).
LOG_LEVEL=info
# Simpan file log harian (logs/meteorabot-YYYY-MM-DD.log) selama X hari,
# yang lebih tua dihapus otomatis saat bot start. 0 = nonaktif (tanpa hapus).
LOG_RETENTION_DAYS=7
# Log PM2 (logs/out.log, logs/error.log) dirotasi via: npm run pm2:logrotate

# ===== Exit — umum =====
# Candle timeframe untuk indikator exit
TIMEFRAME=15m
# Interval cek saat ada posisi (menit; 0.2 = 12 detik)
POLL_INTERVAL_HOLD=0.2
# Interval cek saat tidak ada posisi (menit)
POLL_INTERVAL_IDLE=5
# Jumlah siklus berturut-turut posisi tidak terbaca on-chain sebelum
# dianggap sudah ditutup manual (bot kirim alert Telegram).
MISSING_CYCLE_THRESHOLD=5
# Ambang span bin minimum untuk mengenali posisi spot-quote (mode `spot`).
# Span < nilai ini diklasifikasikan sebagai bidask.
SPOT_MIN_BINS=200
VOLUME_CANDLE_COUNT=5
VOLUME_TIMEFRAME=5m
# --- Data layer ---
# TF native (5m/1h/4h/24h) diambil dari Meteora. TF 15m tidak tersedia di Meteora,
# jadi diambil dari GMGN (native 15m) supaya cocok dengan chart.
CANDLE_15M_SOURCE=gmgn
# Lama cache candle untuk TF native (detik).
CANDLE_CACHE_TTL_SEC=60
# Jeda (detik) setelah bar 15m tutup sebelum request data baru, supaya bar
# baru sudah terbentuk dan bar yang baru tutup sudah final.
CANDLE_CLOSE_DELAY_SEC=3
# Aktifkan Central Data Collector GMGN (1 pintu HTTP langsung + shared disk cache
# lintas worker + antrean prioritas exit). Ubah ke false untuk rollback ke cara lama.
GMGN_CENTRAL_COLLECTOR=true
# File cache candle 15m bersama untuk entry & exit (mencegah request ganda).
GMGN_KLINE_CACHE_FILE=gmgn-kline-cache.json
# File koordinasi slot rate-limit lintas worker PM2.
GMGN_RATE_STATE_FILE=gmgn-rate-state.json
# Batas permintaan GMGN per menit (1 req / 1.2s ≈ 45-50/menit aman tanpa burst).
GMGN_MAX_PER_MIN=45
# Jarak minimum antar permintaan GMGN lintas proses (detik) — mencegah burst IP 429.
GMGN_MIN_GAP_SEC=1.2
# Jika garis Supertrend tak ter-update selama ini (menit), entry pool itu dimatikan.
GMGN_MAX_STALE_MIN=30
# Bila GMGN gagal, fallback ke 15m sintetis Meteora (false = jangan, lebih aman).
GMGN_FALLBACK_TO_METEORA=false
# Batas permintaan Meteora per menit.
METEORA_MAX_PER_MIN=120

# --- Sinyal entry (GMGN 15m + Jupiter) ---
# Interval poll harga Jupiter (detik). 1 request batch untuk semua pool.
# Limit price/v3 ~10 req/10s (~1 req/s); 2 = aman (~5 req/10s), jangan di bawah 1.
JUPITER_POLL_INTERVAL_SEC=2
# Toleransi sentuh garis (%). 0 = entry tepat saat harga <= garis.
ENTRY_TOUCH_TOLERANCE_PCT=0
# Toleransi harga aktif pool terhadap garis Supertrend saat entry (persen).
# Mencegah entry hanya karena harga Jupiter yang turun (pool belum touch).
ENTRY_POOL_LINE_TOLERANCE_PCT=3
# File cache garis Supertrend (agar restart tidak warmup ulang).
SUPERTREND_CACHE_FILE=supertrend-cache.json
# Waktu konfirmasi (detik) sebelum exit trailing TP dieksekusi (hindari wick).
# Drop trailing = max(peak * TRAILING_DROP_RATIO_PCT%, TRAILING_DROP_PCT).
# Rasio adaptif untuk peak besar; floor menjaga peak rendah dari exit karena noise.
# Berlaku untuk trailing TP peak (>= TRAILING_TRIGGER_PCT) maupun trailing dari
# sinyal indikator (RSI+BB / RSI+BB wick / RSI+MACD).
TRAILING_CONFIRM_DELAY_SEC=10

# OOR kanan: default close langsung. Mode dengan OOR_KANAN_MINUTES > 0
# (mis. SPOT_OOR_KANAN_MINUTES=2) menunggu sekian menit; batal bila harga
# kembali masuk range, tutup bila tetap di luar range.

# ===== Exit — Bidask Double-Side (token + SOL, span < SPOT_MIN_BINS) =====
BIDASK_DOUBLE_ENABLE_STOP_LOSS=false
BIDASK_DOUBLE_STOP_LOSS_PCT=-90
BIDASK_DOUBLE_ENABLE_OOR=false
BIDASK_DOUBLE_OOR_KIRI_MINUTES=60
BIDASK_DOUBLE_ENABLE_INDICATORS=true
BIDASK_DOUBLE_RSI_PERIOD=2
BIDASK_DOUBLE_MACD_FAST=12
BIDASK_DOUBLE_MACD_SLOW=26
BIDASK_DOUBLE_MACD_SIGNAL=9
BIDASK_DOUBLE_BB_PERIOD=20
BIDASK_DOUBLE_BB_STDDEV=2
BIDASK_DOUBLE_TRAILING_TAKE_PROFIT=true
BIDASK_DOUBLE_TRAILING_TRIGGER_PCT=10
BIDASK_DOUBLE_TRAILING_DROP_RATIO_PCT=8
BIDASK_DOUBLE_TRAILING_DROP_PCT=1.5

# ===== Exit — Bidask Token-Only (posisi hanya base token, tanpa SOL) =====
# Dipakai juga fallback OOR kiri spot. Stop loss & OOR off, trailing TP off;
# exit lewat sinyal indikator (RSI+MACD / RSI+BB).
BIDASK_TOKEN_ENABLE_STOP_LOSS=false
BIDASK_TOKEN_STOP_LOSS_PCT=-90
BIDASK_TOKEN_ENABLE_OOR=false
BIDASK_TOKEN_OOR_KIRI_MINUTES=60
BIDASK_TOKEN_ENABLE_INDICATORS=true
BIDASK_TOKEN_RSI_PERIOD=2
BIDASK_TOKEN_MACD_FAST=12
BIDASK_TOKEN_MACD_SLOW=26
BIDASK_TOKEN_MACD_SIGNAL=9
BIDASK_TOKEN_BB_PERIOD=20
BIDASK_TOKEN_BB_STDDEV=2
BIDASK_TOKEN_TRAILING_TAKE_PROFIT=false
BIDASK_TOKEN_TRAILING_TRIGGER_PCT=10
BIDASK_TOKEN_TRAILING_DROP_RATIO_PCT=8
BIDASK_TOKEN_TRAILING_DROP_PCT=1.5

# ===== Exit — Bidask Sol-Only (posisi hanya SOL) =====
BIDASK_SOL_ENABLE_STOP_LOSS=false
BIDASK_SOL_STOP_LOSS_PCT=-90
BIDASK_SOL_ENABLE_OOR=false
BIDASK_SOL_OOR_KIRI_MINUTES=60
BIDASK_SOL_ENABLE_INDICATORS=true
BIDASK_SOL_RSI_PERIOD=2
BIDASK_SOL_MACD_FAST=12
BIDASK_SOL_MACD_SLOW=26
BIDASK_SOL_MACD_SIGNAL=9
BIDASK_SOL_BB_PERIOD=20
BIDASK_SOL_BB_STDDEV=2
BIDASK_SOL_TRAILING_TAKE_PROFIT=true
BIDASK_SOL_TRAILING_TRIGGER_PCT=10
BIDASK_SOL_TRAILING_DROP_RATIO_PCT=8
BIDASK_SOL_TRAILING_DROP_PCT=1.5

# ===== Exit — Spot (satu mode, isi SOL-only, span >= SPOT_MIN_BINS) =====
# Tahan trailing & arm indikator selama X menit pertama sejak posisi terlihat
# (2 candle 15m = 30 menit), supaya posisi yang dibuka di puncak tidak langsung
# ter-arm. Stop loss/OOR/yield tetap jalan. 0 = nonaktif.
SPOT_EXIT_WARMUP_MINUTES=60
SPOT_ENABLE_STOP_LOSS=false
SPOT_STOP_LOSS_PCT=-90
# OOR kiri: 0 = tutup langsung saat harga tembus bawah range.
SPOT_ENABLE_OOR=true
SPOT_OOR_KIRI_MINUTES=0
# OOR kanan ber-timer: tunggu 2 menit sebelum tutup (batal bila masuk range).
# Bila volume 5 menit > SPOT_OOR_KANAN_HIGH_VOL_5M_USD ($100k), dipercepat jadi SPOT_OOR_KANAN_FAST_MINUTES (1 menit).
SPOT_OOR_KANAN_MINUTES=2
SPOT_OOR_KANAN_HIGH_VOL_5M_USD=100000
SPOT_OOR_KANAN_FAST_MINUTES=1
SPOT_ENABLE_INDICATORS=true
# Exit indikator spot (RSI+MACD / RSI+BB, candle tutup, setelah warmup):
# immediate (default) = langsung close saat sinyal (tanpa arm trailing & konfirmasi 10s)
# trailing            = perilaku lama: sinyal meng-arm trailing, close saat profit turun dari puncak
# BidAsk tidak terpengaruh. Rebalance OOR kanan tetap bukan exit.
SPOT_INDICATOR_EXIT=immediate
SPOT_RSI_PERIOD=2
SPOT_MACD_FAST=12
SPOT_MACD_SLOW=26
SPOT_MACD_SIGNAL=9
SPOT_BB_PERIOD=20
SPOT_BB_STDDEV=2
SPOT_TRAILING_TAKE_PROFIT=false
SPOT_TRAILING_TRIGGER_PCT=20
SPOT_TRAILING_DROP_RATIO_PCT=8
SPOT_TRAILING_DROP_PCT=1.5
SPOT_ENABLE_BOUNCE_RECOVERY=false
# Yield Spot: 24h Fee/TVL SATU POSISI terbuka (feePerTvl24h, string angka,
# dipakai apa adanya, tanpa ×100/÷100). Sama dengan baris Yield di status.
# Bukan PnL, bukan unclaimed/saldo, bukan all-time fee, bukan angka ringkasan pool.
# Hanya isClosed=false. Waktu fetch dan updatedAt (unix detik) harus segar.
# Angka segar < ambang harus terus-menerus selama SPOT_YIELD_CLOSE_BELOW_SEC
# detik (60 detik, bukan 10 menit) baru close + klaim + swap.
# Poll pertama yang sudah mencapai 60 detik yang menutup. Tepat 7 atau di atasnya
# mereset hitungan (yield tinggi tetap dipegang). Tanpa syarat PnL.
# Data basi, kosong, atau tidak valid juga mereset; tidak dihitung kelanjutan.
# Restart bot mengulang hitungan dari nol, tidak langsung exit dari timer lama.
# Bukan alasan re-entry OOR. Stop loss / OOR / trailing tetap bisa menutup sendiri.
# Ambang 0 = nonaktif. Detik 0 = tutup di poll pertama yang segar dan di bawah ambang.
# Kunci lama TIDAK dibaca:
#   SPOT_HIGH_YIELD_CLOSE_PCT, SPOT_LOW_YIELD_CLOSE_PCT, SPOT_LOW_YIELD_DELAY_MINUTES
SPOT_YIELD_CLOSE_BELOW_PCT=7
SPOT_YIELD_CLOSE_BELOW_SEC=60

# ===== Fallback OOR kiri Spot → posisi Bidask Token-Only =====
# Saat OOR kiri: tutup tanpa swap token, lalu buka posisi token-only satu-sisi
# di pool yang sama memakai seluruh saldo token. Range: binsBelow/binsAbove
# relatif harga aktif. Gagal buka → retry sebanyak ini lalu token dilepas.
SPOT_FALLBACK_ENABLED=true
SPOT_FALLBACK_BINS_BELOW=0
SPOT_FALLBACK_BINS_ABOVE=70
SPOT_FALLBACK_RETRY=3

# ===== Re-entry Spot saat OOR Kanan (mengejar ATH) =====
# Saat posisi spot (SOL-only, span >= SPOT_MIN_BINS) ditutup karena OOR kanan,
# bot langsung membuka posisi spot SOL-only baru di harga aktif saat itu,
# memakai jumlah bin ke bawah yang SAMA seperti posisi yang barusan ditutup.
# - Range di-anchor ulang ke active bin (bukan bin id lama), jadi persentase
#   range tetap sama (mis. 244 bin bawah = -90% relatif harga baru).
# - Size re-entry = entrySizeSol posisi lama; bila hilang, pakai size entry di
#   pool.txt (multiplier × ENTRY_DEFAULT_SIZE_SOL). Biaya pakai ENTRY_FEE_MODE
#   & ENTRY_FEE_MAX_SOL yang sudah ada.
# - Rantai berhenti bila: exit bukan OOR kanan, saldo SOL tidak cukup, atau
#   sudah mencapai SPOT_REENTRY_MAX kali.
# false = fitur mati (OOR kanan cuma ditutup biasa).
SPOT_REENTRY_ENABLED=true
# Maksimal re-entry per rantai (posisi manual awal TIDAK dihitung).
SPOT_REENTRY_MAX=50
# Cooldown antar loop re-entry OOR kanan pada pool yang sama (detik, 120 = 2 menit;
# otomatis mengikuti 60 detik bila volume 5m > SPOT_OOR_KANAN_HIGH_VOL_5M_USD).
SPOT_REENTRY_COOLDOWN_SEC=120
SPOT_REENTRY_FAST_COOLDOWN_SEC=60
# Tolak re-entry bila akan kena biaya NON-REFUNDABLE saat buka posisi, yaitu
# sewa bin array baru / bitmap extension (hangus, tidak kembali saat close).
# Sewa akun posisi (refundable) tidak menghalangi.
SPOT_REENTRY_SKIP_NONREFUNDABLE=true
# Batas biaya non-refundable yang masih boleh (SOL). 0 = tolak bila ada sama
# sekali. Naikkan bila mau menoleransi mis. 1 bin array (0.07143744).
SPOT_REENTRY_MAX_NONREFUNDABLE_SOL=0
# Entry spot pertama: bila seluruh tangga -95/-90/-85/-80% kena sewa
# non-refundable, cari pool TOKEN/SOL lain untuk mint yang sama yang bebas
# sewa itu (tanpa syarat bin step) lalu entry di sana dengan size yang sama.
# false = pool langsung di-skip dan dinonaktifkan seperti sebelumnya.
SPOT_RENT_FALLBACK_POOL=true

# ===== Cara rebalance (spot dan bidask:double, kedua sisi) =====
# inplace = instruksi rebalance_liquidity: likuiditas ditarik dan disetor ulang
# di posisi yang sama, tanpa memakai saldo token/SOL yang sudah ada di wallet.
# Batas posisi tidak disusutkan. withdraw = perilaku lama (tarik ke wallet lalu
# setor), tetapi hanya sejumlah yang benar-benar keluar dari posisi.
# Perubahan dipakai setelah restart meteorabot-exit.
REBALANCE_MODE=inplace

# ===== Rebalance Sisi Token Spot → BidAsk (tiap step % bin) =====
# Saat posisi spot (SOL-only, span >= SPOT_MIN_BINS) turun di dalam range,
# bin di atas active bin berubah menjadi token base. Setiap kenaikan kelipatan
# SPOT_TOKEN_BIDASK_STEP_PCT (mis. 10%, 20%, 30%, 40%, 50%, dst. bin di atas
# active bin), bot menarik 100% token dari bin (activeBin+1 .. upperBin) dan
# menyetor ulang ke posisi yang sama dengan strategi BidAsk.
SPOT_TOKEN_BIDASK_ENABLED=true
SPOT_TOKEN_BIDASK_STEP_PCT=10
SPOT_TOKEN_BIDASK_COOLDOWN_SEC=60
SPOT_TOKEN_BIDASK_RETRY=3

# ===== Rebalance sisi token bidask:double → BidAsk =====
# Saat harga pool turun dari entryPoolPrice MASING-MASING posisi (utama dan
# tiap posisi DCA sendiri), tiap kelipatan STEP_PCT bot menarik token yang
# duduk di bin di atas bin aktif dan menyetor ulang ke posisi yang sama
# dengan bentuk BidAsk. SOL tidak masuk/keluar. Range posisi tidak disusutkan.
# Bukan persen isi bin seperti spot: -10%, -20%, -30%, ... dari harga entry.
# false = fitur mati (posisi dibiarkan bentuk awalnya), termasuk sisi SOL.
# Perubahan dipakai setelah restart meteorabot-exit.
BIDASK_DOUBLE_REBALANCE_ENABLED=true
# Sisi SOL: setelah rebalance token, saat harga pulih minimal satu step
# (dan naik harga atau geser bin cukup satu step), SOL di bawah bin aktif
# dibentuk ulang jadi BidAsk. false = sisi SOL tidak diapa-apakan.
BIDASK_DOUBLE_SOL_REBALANCE_ENABLED=true
BIDASK_DOUBLE_REBALANCE_STEP_PCT=10
# Jeda minimum (detik) antar rebalance pada posisi yang sama.
BIDASK_DOUBLE_REBALANCE_COOLDOWN_SEC=60
# Percobaan ulang setor token setelah tarik, bila transaksi gagal.
BIDASK_DOUBLE_REBALANCE_RETRY=3

# --- Baris CA di pool.txt (<mint>,size,,spot,ca — kolom max lama diabaikan) ---
# Saat entry, bot ambil semua pool DLMM X/SOL token itu dari Meteora (timeframe 30m) dan pilih
# fee/active TVL 30m tertinggi — tanpa filter (worker sudah menyaring). Tidak ada pool = skip siklus.
# Cache hasil per CA (detik):
CA_POOL_CACHE_SEC=60
